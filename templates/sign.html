<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signatures</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Herr+Von+Muellerhoff&family=La+Belle+Aurore&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6f8; --panel:#fff; --ink:#1b1f24; --muted:#667085; --line:#e3e6eb;
  --accent:#0f5fd6; --accent-ink:#fff; --ok:#137a3f; --ok-bg:#e7f6ec; --warn:#9a5b00; --warn-bg:#fff4e0;
  --bad:#b42318; --bad-bg:#fdecea; --field:#fbfbfc; --pad:#fff; --sig:#111;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#111418; --panel:#191d23; --ink:#e7eaee; --muted:#98a2b3; --line:#2a3039;
  --accent:#5b9cff; --accent-ink:#0b1220; --ok:#5fd08d; --ok-bg:#12291c; --warn:#f3b454; --warn-bg:#2d2310;
  --bad:#ff8a80; --bad-bg:#2e1614; --field:#14181d;
}}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:14px 24px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{font-size:17px;margin:0;font-weight:650}
a{color:var(--accent)}
.pill{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.spacer{flex:1}
button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 13px;border-radius:8px;cursor:pointer}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button:disabled{opacity:.5;cursor:default}
main{max-width:1100px;margin:0 auto;padding:20px 24px 80px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.req{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px}
.req .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.req .title{font-weight:650;font-size:15px}
.req .meta{color:var(--muted);font-size:13px;margin-top:2px}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.step{border:1px solid var(--line);border-radius:10px;padding:8px 11px;min-width:200px;flex:1;font-size:13px}
.step b{display:block;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.step.done{border-color:color-mix(in srgb,var(--ok) 45%,var(--line));background:var(--ok-bg)}
.step.next{border-color:color-mix(in srgb,var(--warn) 55%,var(--line));background:var(--warn-bg)}
.step .who{font-weight:600;color:var(--ink)} .step .when{color:var(--muted);font-size:12px}
.step .nouser{color:var(--bad);font-size:12px}
.actions{display:flex;gap:8px;margin-top:12px;justify-content:flex-end}
.empty{color:var(--muted);text-align:center;padding:40px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);padding:0;width:min(760px,96vw);max-height:94vh}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog .body{padding:18px 20px;overflow:auto;max-height:calc(94vh - 64px)}
dialog h2{margin:0 0 4px;font-size:17px}
dialog .foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--line);align-items:center;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0 14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
td.n,th.n{text-align:right;white-space:nowrap}
tr.total td{font-weight:700;border-bottom:0}
.h3{font-weight:650;margin:14px 0 2px}
.mode{display:flex;gap:6px;margin:10px 0}
.mode button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
input[type=text]{font:inherit;font-size:15px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
.styles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.style{border:2px solid var(--line);border-radius:10px;background:var(--pad);color:var(--sig);height:78px;display:flex;align-items:center;justify-content:center;font-size:34px;overflow:hidden;white-space:nowrap;padding:0 8px}
.style.on{border-color:var(--accent)}
.padwrap{position:relative;border:2px dashed var(--line);border-radius:10px;background:var(--pad);touch-action:none}
#pad{display:block;width:100%;height:190px;cursor:crosshair}
.padline{position:absolute;left:24px;right:24px;bottom:42px;border-bottom:1px solid #c9ced6;pointer-events:none}
.padhint{position:absolute;left:24px;bottom:18px;font-size:12px;color:#98a2b3;pointer-events:none}
.saved{background:var(--pad);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;align-items:center;justify-content:center;min-height:90px}
.saved img{max-height:80px;max-width:100%}
label.chk{display:flex;gap:8px;align-items:flex-start;margin-top:12px;font-size:13px}
label.chk input{margin-top:3px}
.err{background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:9px 11px;margin-top:10px;font-size:13px}
.hint{font-size:12px;color:var(--muted)}
#pv{width:min(960px,96vw)}
#pv .body{padding:0;max-height:none}
#pvFrame{display:block;width:100%;height:min(80vh,1100px);border:0;background:#525659}
.pdfbox{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:10px 0 14px}
.pdfbox iframe{display:block;width:100%;height:520px;border:0;background:#525659}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:.2s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
@media (max-width:700px){ main{padding:16px} header{padding:12px 16px} .styles{grid-template-columns:1fr} .step{min-width:100%} }
</style>
</head>
<body>
<header>
  <h1>Signatures</h1>
  <a href="/">← Invoices</a>
  <span class="spacer"></span>
  <span id="whoami" class="pill"></span>
  <form method="post" action="/logout" style="margin:0"><button>Sign out</button></form>
</header>
<main>
  <div class="tabs" id="tabs">
    <button data-f="mine">Waiting for me</button>
    <button data-f="signing">In progress</button>
    <button data-f="complete">Fully signed</button>
    <button data-f="all">All</button>
  </div>
  <div id="list"><div class="empty">Loading…</div></div>
</main>

<dialog id="dlg">
  <div class="body">
    <h2 id="dTitle"></h2>
    <div class="hint" id="dMeta"></div>
    <div id="dSummary"></div>

    <div class="h3" id="dRole"></div>
    <div class="mode" id="mode">
      <button data-m="typed">Type my name</button>
      <button data-m="drawn">Draw my signature</button>
      <button data-m="saved" id="savedTab" hidden>Use saved signature</button>
    </div>

    <div id="mTyped">
      <input type="text" id="typed" maxlength="60" autocomplete="name" aria-label="Your name">
      <div class="styles" id="styles"></div>
      <div class="hint" style="margin-top:6px">Pick the style you like - this is your signature.</div>
    </div>

    <div id="mDrawn" hidden>
      <div class="padwrap"><canvas id="pad"></canvas><div class="padline"></div><div class="padhint">Sign above the line</div></div>
      <div style="display:flex;justify-content:flex-end;margin-top:6px"><button id="clearPad">Clear</button></div>
    </div>

    <div id="mSaved" hidden><div class="saved"><img id="savedImg" alt="Your saved signature"></div>
      <div style="display:flex;justify-content:flex-end;margin-top:6px"><button id="forget">Forget saved signature</button></div></div>

    <label class="chk"><input type="checkbox" id="agree"> <span id="agreeText"></span></label>
    <label class="chk" id="rememberRow"><input type="checkbox" id="remember" checked> Save this signature for next time</label>
    <div class="err" id="dErr" hidden></div>
  </div>
  <div class="foot">
    <a id="dDownload" href="#" style="margin-right:auto">Download requisition (PDF)</a>
    <button id="dCancel">Cancel</button>
    <button class="primary" id="dSign">Sign</button>
  </div>
</dialog>
<dialog id="pv">
  <div class="body"><iframe id="pvFrame" title="Requisition preview"></iframe></div>
  <div class="foot"><span id="pvTitle" class="hint" style="margin-right:auto"></span>
    <a id="pvDownload" href="#"><button>Download</button></a><button id="pvClose" class="primary">Close</button></div>
</dialog>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = v => 'R ' + (Number(v)||0).toLocaleString('en-ZA',{minimumFractionDigits:2,maximumFractionDigits:2});
const when = s => s ? new Date(s).toLocaleString('en-ZA',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '';
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2800)}
async function api(url, opts={}){
  const r = await fetch(url, {headers:{'Content-Type':'application/json'}, ...opts});
  const body = await r.json().catch(()=>({}));
  if(r.status===401){ location.href='/login'; throw new Error('Please sign in'); }
  if(!r.ok) throw new Error(body.error || r.statusText);
  return body;
}

let data = {items:[], user:{}}, filter = 'mine', saved = null;
const FONTS = [['Mrs Saint Delafield',48],['Herr Von Muellerhoff',50],['La Belle Aurore',30]];  // [font, preview px]
const INK = '#111';

async function load(){
  data = await api('/api/signing');
  $('#whoami').textContent = data.user.name;
  const mine = data.items.filter(i=>i.can_sign).length;
  if(filter==='mine' && !mine && !load._done) filter = 'signing';
  load._done = true;
  $('#tabs').querySelector('[data-f=mine]').textContent = `Waiting for me (${mine})`;
  render();
}

function stepHtml(sl, it){
  const isNext = it.next === sl.slot;
  const cls = sl.signed_at ? 'done' : isNext ? 'next' : '';
  const status = sl.signed_at
    ? `<div class="when">Signed ${esc(when(sl.signed_at))} · ${sl.method==='typed'?'typed':'drawn'}</div>`
    : `<div class="when">${isNext ? 'Waiting to sign' : 'Not yet'}</div>`;
  const nouser = !sl.signed_at && !sl.has_user
    ? `<div class="nouser">No app user is called "${esc(sl.name)}" - an admin needs to add them under Users with this exact name.</div>` : '';
  return `<div class="step ${cls}"><b>${esc(sl.label)}</b><span class="who">${sl.signed_at?'✓ ':''}${esc(sl.signed_name||sl.name)}</span>${status}${nouser}</div>`;
}

function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on', b.dataset.f===filter));
  const items = data.items.filter(i => filter==='all' || (filter==='mine' ? i.can_sign : i.status===filter));
  $('#list').innerHTML = items.length ? items.map(it => `
    <div class="req" data-id="${it.id}">
      <div class="top"><span class="title">${esc(it.summary.payee)}</span>
        <span class="pill">${money(it.summary.total)}</span>
        ${it.status==='complete' ? '<span class="pill ok">Fully signed</span>' : it.can_sign ? '<span class="pill warn">Your turn</span>' : ''}
        <span class="spacer"></span></div>
      <div class="meta">${esc(it.file_name)} · created by ${esc(it.owner_name)} on ${esc(when(it.created))}</div>
      <div class="steps">${it.slots.map(sl=>stepHtml(sl, it)).join('')}</div>
      <div class="actions"><a href="/api/signing/${it.id}/file"><button>Download</button></a>
        ${it.is_pdf ? '<button data-act="preview">Preview</button>' : ''}
        <button data-act="view" class="${it.can_sign?'primary':''}">${it.can_sign?'Review & sign':'View'}</button></div>
    </div>`).join('') : `<div class="empty">${filter==='mine' ? 'Nothing is waiting for your signature.' : 'Nothing here yet.'}</div>`;
}

$('#tabs').onclick = e => { const f = e.target.dataset.f; if(f){ filter = f; render(); } };
$('#list').onclick = e => {
  const act = e.target.dataset.act; if(!act) return;
  const id = e.target.closest('.req').dataset.id;
  if(act==='view') openSign(id);
  if(act==='preview') openPreview(id);
};
const previewUrl = it => `/api/signing/${it.id}/file?inline=1&v=${it.version}#view=FitH`;
function openPreview(id){
  const it = data.items.find(i=>i.id===id);
  $('#pvFrame').src = previewUrl(it);
  $('#pvTitle').textContent = `${it.summary.payee} · ${it.version} of ${it.slots.length} signed`;
  $('#pvDownload').href = `/api/signing/${it.id}/file`;
  $('#pv').showModal();
}
$('#pvClose').onclick = () => $('#pv').close();
$('#pv').addEventListener('close', () => { $('#pvFrame').src = 'about:blank'; });

// ------------------------------------------------------------ signing dialog
let current = null, mode = 'typed', fontIx = 0;

function summaryHtml(s){
  const lines = s.lines.map(l=>`<tr><td>${esc(l[0])}</td><td>${esc(l[1])}</td><td class="n">${l[2]!=null && l[2]!=='' && !isNaN(l[2]) ? money(l[2]) : ''}</td></tr>`).join('');
  const alloc = s.allocations.map(a=>`<tr><td>${esc(a[0])}</td><td>${esc(a[1]||'-')}</td><td class="n">${money(a[2])}</td></tr>`).join('');
  return `<table><thead><tr><th>Description</th><th>Inv no.</th><th class="n">Amount</th></tr></thead>
    <tbody>${lines}<tr class="total"><td>Total due</td><td></td><td class="n">${money(s.total)}</td></tr></tbody></table>
    <table><thead><tr><th>Account allocation</th><th>Account no.</th><th class="n">Amount</th></tr></thead><tbody>${alloc}</tbody></table>`;
}

async function openSign(id){
  current = data.items.find(i=>i.id===id);
  const s = current.summary, sl = current.slots.find(x=>x.slot===current.next);
  $('#dTitle').textContent = s.payee;
  $('#dMeta').textContent = `${current.file_name} · payment date ${s.date} · created by ${current.owner_name}`;
  $('#dSummary').innerHTML = (current.is_pdf ? `<div class="pdfbox"><iframe src="${previewUrl(current)}" title="Requisition preview"></iframe></div>` : summaryHtml(s)) + `<div class="steps">${current.slots.map(x=>stepHtml(x, current)).join('')}</div>`;
  $('#dDownload').href = `/api/signing/${id}/file`;
  const signing = current.can_sign;
  ['#dRole','#mode','#mTyped','#mDrawn','#mSaved','#rememberRow'].forEach(x=>$(x).hidden = !signing);
  $('#agree').parentElement.hidden = !signing;
  $('#dSign').hidden = !signing;
  $('#dErr').hidden = true;
  if(signing){
    $('#dRole').textContent = `Sign as: ${sl.label}`;
    $('#agreeText').textContent = `I, ${data.user.name}, have reviewed this payment requisition (${money(s.total)}) and sign it as ${sl.label}.`;
    $('#agree').checked = false;
    $('#typed').value = data.user.name;
    saved = await api('/api/me/signature').catch(()=>({}));
    $('#savedTab').hidden = !saved.image;
    if(saved.image) $('#savedImg').src = saved.image;
    setMode(saved.image ? 'saved' : 'typed');
  }
  $('#dlg').showModal();
  if(signing) sizePad();
}

function setMode(m){
  mode = m;
  document.querySelectorAll('#mode button').forEach(b=>b.classList.toggle('on', b.dataset.m===m));
  $('#mTyped').hidden = m!=='typed'; $('#mDrawn').hidden = m!=='drawn'; $('#mSaved').hidden = m!=='saved';
  $('#rememberRow').hidden = m==='saved';
  if(m==='typed') renderStyles();
  if(m==='drawn') sizePad();
}
$('#mode').onclick = e => { if(e.target.dataset.m) setMode(e.target.dataset.m); };

function renderStyles(){
  const name = $('#typed').value.trim() || ' ';
  $('#styles').innerHTML = FONTS.map(([f,px],i)=>
    `<button type="button" class="style ${i===fontIx?'on':''}" data-i="${i}" style="font-family:'${f}',cursive;font-size:${px}px">${esc(name)}</button>`).join('');
}
$('#typed').oninput = renderStyles;
$('#styles').onclick = e => { const b = e.target.closest('.style'); if(b){ fontIx = +b.dataset.i; renderStyles(); } };

// typed name -> PNG, cropped to the ink
async function typedPng(){
  const name = $('#typed').value.trim();
  if(!name) throw new Error('Type your name first');
  const [font] = FONTS[fontIx];
  const px = 96;
  await document.fonts.load(`${px}px "${font}"`);
  const c = document.createElement('canvas'), g = c.getContext('2d');
  g.font = `${px}px "${font}"`;
  c.width = Math.ceil(g.measureText(name).width + px * 1.5); c.height = Math.ceil(px * 2.6);
  g.font = `${px}px "${font}"`; g.fillStyle = INK; g.textBaseline = 'middle';
  g.fillText(name, px/2, c.height/2);
  return crop(c);
}

// drawing pad
const pad = $('#pad'), pg = pad.getContext('2d');
let drawing = false, last = null, inked = false;
function sizePad(){
  const r = pad.getBoundingClientRect(); if(!r.width) return;
  const dpr = window.devicePixelRatio || 1;
  if(pad.width === Math.round(r.width*dpr)) return;
  pad.width = Math.round(r.width*dpr); pad.height = Math.round(r.height*dpr);
  pg.setTransform(dpr,0,0,dpr,0,0); pg.lineCap = pg.lineJoin = 'round'; pg.strokeStyle = INK; inked = false;
}
function pt(e){ const r = pad.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top, p:e.pressure||0.5}; }
let width = 0;
pad.addEventListener('pointerdown', e => { drawing = true; width = 0; last = pt(e); pad.setPointerCapture(e.pointerId); });
pad.addEventListener('pointermove', e => {
  if(!drawing) return;
  const p = pt(e), mid = {x:(last.x+p.x)/2, y:(last.y+p.y)/2};
  const speed = Math.hypot(p.x-last.x, p.y-last.y);
  const target = e.pointerType==='pen' ? 1 + p.p*2.6 : Math.max(1.1, Math.min(3.1, 3.4 - speed*0.12));
  width = width ? width*0.7 + target*0.3 : target;  // ease between widths so the line flows
  pg.lineWidth = width;
  pg.beginPath(); pg.moveTo(last.mx ?? last.x, last.my ?? last.y); pg.quadraticCurveTo(last.x, last.y, mid.x, mid.y); pg.stroke();
  last = {...p, mx:mid.x, my:mid.y}; inked = true;
});
['pointerup','pointercancel','pointerleave'].forEach(ev=>pad.addEventListener(ev, ()=>{ drawing = false; }));
$('#clearPad').onclick = () => { pg.clearRect(0,0,pad.width,pad.height); inked = false; };
window.addEventListener('resize', ()=>{ if(!$('#mDrawn').hidden){ pad.width = 0; sizePad(); } });

function crop(src){
  const g = src.getContext('2d'), {width:w, height:h} = src, px = g.getImageData(0,0,w,h).data;
  let x0=w, y0=h, x1=-1, y1=-1;
  for(let y=0;y<h;y++) for(let x=0;x<w;x++) if(px[(y*w+x)*4+3] > 8){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
  if(x1<0) throw new Error('The signature is empty');
  const m = 6, out = document.createElement('canvas');
  out.width = x1-x0+1+2*m; out.height = y1-y0+1+2*m;
  out.getContext('2d').drawImage(src, x0-m, y0-m, out.width, out.height, 0, 0, out.width, out.height);
  return out.toDataURL('image/png');
}

async function signatureImage(){
  if(mode==='saved') return {image: saved.image, method: saved.method || 'typed', typed_text: saved.typed_text || ''};
  if(mode==='typed') return {image: await typedPng(), method:'typed', typed_text: $('#typed').value.trim()};
  if(!inked) throw new Error('Draw your signature in the box first');
  return {image: crop(pad), method:'drawn'};
}

$('#dSign').onclick = async () => {
  const err = $('#dErr'); err.hidden = true;
  try{
    if(!$('#agree').checked) throw new Error('Please tick the box to confirm.');
    const sig = await signatureImage();
    $('#dSign').disabled = true;
    const r = await api(`/api/signing/${current.id}/sign`, {method:'POST', body: JSON.stringify({...sig, agree:true,
      remember: mode!=='saved' && $('#remember').checked})});
    $('#dlg').close();
    toast(r.status==='complete' ? 'Signed - the requisition is now fully signed' : 'Signed - it has moved to the next person');
    load();
  }catch(e){ err.textContent = e.message; err.hidden = false; }
  finally{ $('#dSign').disabled = false; }
};
$('#dCancel').onclick = () => $('#dlg').close();
$('#forget').onclick = async () => { await api('/api/me/signature',{method:'DELETE'}); saved = {}; $('#savedTab').hidden = true; setMode('typed'); toast('Saved signature removed'); };

load();
</script>
</body>
</html>
